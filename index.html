<!DOCTYPE html>
<html lang="tet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 Dikas Estudu nian</title>
    <style>
        /* --- ESTILIZAÇÃO CSS --- */
        
        /* Fundo bem feito com um gradiente moderno em tons de cor-de-rosa */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* Contentor Principal (Cartão) */
        .tips-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(219, 112, 147, 0.3);
            width: 90%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 26px;
            color: #d81b60;
            margin-bottom: 8px;
            margin-top: 0;
        }

        header p {
            color: #880e4f;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Caixa de Exibição da Dica */
        .card-tip {
            background: #fff5f8;
            border-left: 5px solid #ff4081;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.08);
            transition: transform 0.2s ease;
        }

        .card-tip:hover {
            transform: translateY(-3px);
        }

        .tip-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        #tip-text {
            font-size: 16px;
            font-style: italic;
            line-height: 1.6;
            margin: 10px 0;
            color: #4c001f;
        }

        .badge {
            background: #fce4ec;
            color: #c2185b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        /* Botões Estilizados e Funcionais */
        button {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #f50057, #c2185b);
            box-shadow: 0 6px 14px rgba(216, 27, 96, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Secção do Formulário */
        .add-tip-section {
            margin-top: 30px;
            border-top: 2px dashed #f8bbd0;
            padding-top: 20px;
            text-align: left;
        }

        .add-tip-section h3 {
            font-size: 15px;
            color: #c2185b;
            margin-bottom: 10px;
        }

        #form-add-tip input, #form-add-tip select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            border: 1px solid #f8bbd0;
            border-radius: 10px;
            box-sizing: border-box;
            background-color: #fff8fa;
            font-size: 14px;
        }

        #form-add-tip input:focus, #form-add-tip select:focus {
            outline: none;
            border-color: #ff4081;
            background-color: #ffffff;
        }

        #form-add-tip button {
            background: #880e4f;
            padding: 10px 20px;
            font-size: 14px;
            box-shadow: none;
        }

        #form-add-tip button:hover {
            background: #ad1457;
        }
    </style>
</head>
<body>

    <!-- --- ESTRUTURA HTML --- -->
    <main class="tips-container">
        <header>
            <h1>📚 Hakbiit O nia Estudu!</h1>
            <p>Klik botaun iha okos hodi hetan dikas foun.</p>
        </header>

        <section class="card-tip">
            <div class="tip-icon">💡</div>
            <p id="tip-text">"Kria planu estuda nian no deskansa minutu 5 kada estudu minutu 25."</p>
            <span id="tip-category" class="badge">Métodu Pomodoro</span>
        </section>

        <section class="controls">
            <button id="btn-next-tip">Hetan Dikas Foun ✨</button>
        </section>

        <footer class="add-tip-section">
            <h3>Hatama O nia Dikas Rasik:</h3>
            <form id="form-add-tip">
                <input type="text" id="input-tip" placeholder="Hakerek dikas foun iha ne'e..." required>
                <select id="select-category">
                    <option value="Foku">Foku</option>
                    <option value="Memória">Memória</option>
                    <option value="Saúde Mental">Saúde Mental</option>
                </select>
                <button type="submit">Submete Dikas</button>
            </form>
        </footer>
    </main>

    <!-- --- LÓGICA JAVASCRIPT --- -->
    <script>
        // Lista de dicas inicial
        const listaDikas = [
            { text: "Kria planu estuda nian no deskansa minutu 5 ba kada estudu ne'ebe hala'o ona durante minutu 25.", category: "Métodu Pomodoro" },
            { text: "Hanorin fali buat ne'ebé  aprende ba ema seluk atu haforsa o-nia memória.", category: "Memória" },
            { text: "Hadook telemóvel husi meza estuda nian atu o nia fuan no neon labele sala.", category: "Foku" },
            { text: "Deskansa(toba) oras 7-8 kada kalan hodi ajuda kakutak rai informasaun ho di'ak.", category: "Saúde Mentaul" },
            { text: "Hakerek fali rezumu uza o nia liafuan rasik, labele kopia de'it husi livru.", category: "Memória" }
        ];

        // Elementos do HTML
        const tipText = document.getElementById("tip-text");
        const tipCategory = document.getElementById("tip-category");
        const btnNextTip = document.getElementById("btn-next-tip");
        const formAddTip = document.getElementById("form-add-tip");
        const inputTip = document.getElementById("input-tip");
        const selectCategory = document.getElementById("select-category");

        // Função para mostrar dica aleatória
        function hatuduDikasAleatorio() {
            const randomIndex = Math.floor(Math.random() * listaDikas.length);
            const dikasHili = listaDikas[randomIndex];
            
            tipText.innerText = `"${dikasHili.text}"`;
            tipCategory.innerText = dikasHili.category;
        }

        // Evento do botão principal
        btnNextTip.addEventListener("click", hatuduDikasAleatorio);

        // Evento para adicionar nova dica
        formAddTip.addEventListener("submit", function(event) {
            event.preventDefault();
            
            const dikasFoun = {
                text: inputTip.value,
                category: selectCategory.value
            };
            
            listaDikas.push(dikasFoun);
            
            // Mostra imediatamente a dica criada
            tipText.innerText = `"${dikasFoun.text}"`;
            tipCategory.innerText = dikasFoun.category;
            
            // Limpa o formulário
            inputTip.value = "";
        });
    </script>
</body>
</html>
